name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable annotated draft tag (for example, v0.8.1)
        required: true
        type: string
      candidate_run_id:
        description: Successful release.yml candidate run ID
        required: true
        type: string
      clean_host_evidence_json:
        description: Human-recorded exact-EXE clean-host evidence JSON
        required: true
        type: string

permissions:
  contents: read

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  validate:
    name: Validate existing candidate without Release write authority
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet-sdk-10.0.400
        with:
          dotnet-version: 10.0.400
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify the candidate run before consuming artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or
              $env:CANDIDATE_RUN_ID -cnotmatch '^[1-9][0-9]*$') { throw 'Invalid release identity.' }
          $tagCommit = ((& git rev-list -n 1 $env:RELEASE_TAG) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Missing tag commit.' }
          $runJson = @(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID")
          if ($LASTEXITCODE -ne 0 -or $runJson.Count -eq 0) { throw 'Unable to retrieve candidate run.' }
          $run = ConvertFrom-Json -InputObject ($runJson -join "`n") -DateKind String
          $workflowPath = [string]$run.path
          $workflowPathParts = @($workflowPath -csplit '@', 2)
          if ($workflowPathParts[0] -cne '.github/workflows/release.yml' -or
              ($workflowPathParts.Count -eq 2 -and
                ($workflowPathParts[1] -cnotmatch '\Arefs/(?:heads|tags)/[A-Za-z0-9._/-]+\z' -or
                 $workflowPathParts[1] -cmatch '(?:\A|/)\.\.?(?:/|\z)|//|\.lock(?:/|\z)')) -or
              [string]$run.repository.full_name -cne $env:GITHUB_REPOSITORY -or
              [string]$run.event -cne 'workflow_dispatch' -or
              [string]$run.status -cne 'completed' -or
              [string]$run.conclusion -cne 'success' -or
              [string]$run.head_sha -cne $tagCommit) { throw 'Candidate run/source mismatch.' }
      - name: Download original candidate controls
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.tag }}-${{ inputs.candidate_run_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/publish-candidate-root
      - name: Download original public candidate bytes
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ inputs.tag }}-${{ inputs.candidate_run_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/publish-candidate-root
      - name: Download original candidate observations
        uses: actions/download-artifact@v4
        with:
          name: release-automation-${{ inputs.tag }}-${{ inputs.candidate_run_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-observations
      - name: Validate and persist received clean-host evidence
        shell: pwsh
        env:
          CLEAN_HOST_EVIDENCE_JSON: ${{ inputs.clean_host_evidence_json }}
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false, $true)
          $bytes = $utf8.GetBytes($env:CLEAN_HOST_EVIDENCE_JSON)
          if ($bytes.Length -le 0 -or $bytes.Length -gt 65536) { throw 'Invalid clean-host JSON size.' }
          [System.IO.File]::WriteAllBytes(
            (Join-Path $env:RUNNER_TEMP 'windows-singlefile-clean-host.evidence.json'), $bytes)
      - name: Build and validate final publish controls
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          $candidateRoot = Join-Path $env:RUNNER_TEMP 'publish-candidate-root'
          $finalRoot = Join-Path $env:RUNNER_TEMP 'final-control'
          & .\scripts\build-platform-release-matrix.ps1 `
            -Mode Final -ExpectedRepository $env:GITHUB_REPOSITORY `
            -CandidateRunId $env:CANDIDATE_RUN_ID `
            -CandidateRecordPath (Join-Path $candidateRoot 'release-candidate-record.json') `
            -CleanHostEvidencePath (Join-Path $env:RUNNER_TEMP 'windows-singlefile-clean-host.evidence.json') `
            -OutputDirectory $finalRoot
          if (-not $?) { throw 'Final C02/C03 validation failed.' }
          .\scripts\prepare-release-automation.ps1 -Mode Publish `
            -ArtifactDirectory $finalRoot `
            -CandidateRequestPath "$env:RUNNER_TEMP\original-observations\request.json" `
            -OutputDirectory "$env:RUNNER_TEMP\release-automation"
      - name: Upload final publish control evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-final-control-${{ inputs.tag }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/final-control/platform-release-matrix.json
            ${{ runner.temp }}/final-control/windows-singlefile-clean-host.evidence.json
            ${{ runner.temp }}/final-control/release-candidate-record.json
            ${{ runner.temp }}/final-control/StudyReportEvaluator-win-x64.exe.evidence.json
            ${{ runner.temp }}/final-control/StudyReportEvaluator-win-x64.evidence.json
            ${{ runner.temp }}/final-control/StudyReportEvaluator-win-x64.unsigned.test.msix.sha256
            ${{ runner.temp }}/final-control/StudyReportEvaluator-win-x64.unsigned.test.evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload private publication request and verified bytes
        uses: actions/upload-artifact@v7
        with:
          name: publish-automation-${{ github.run_id }}
          path: ${{ runner.temp }}/release-automation/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Revalidate exact draft bytes and publish after approval
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    environment: publish
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Check out driver only
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download validated publication request
        uses: actions/download-artifact@v4
        with:
          name: publish-automation-${{ github.run_id }}
          path: ${{ runner.temp }}/release-automation
      - name: Revalidate exact draft bytes and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\scripts\prepare-release-automation.ps1 -Mode Relocate -OutputDirectory "$env:RUNNER_TEMP\release-automation"
          .\scripts\invoke-release-automation.ps1 `
            -RequestPath "$env:RUNNER_TEMP\release-automation\request.json" `
            -ResultPath "$env:RUNNER_TEMP\release-result.json"
          if ($LASTEXITCODE -ne 0) { throw 'Publication stopped; inspect private transaction result.' }
      - name: Record transaction result including stopped stage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publish-result-${{ github.run_id }}
          path: ${{ runner.temp }}/release-result.json
          if-no-files-found: warn
