name: ebak-verify

# Re-runs the L1 deterministic verification outside the agent (plan §10, Q-5).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - name: Install verification dependencies
        run: python -m pip install pytest PyYAML
      - name: Require native x64
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64' -or
              [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'X64') {
              throw 'Required validation needs a real x64 OS and x64 process.'
          }
      - name: verify
        run: python scripts/verify.py --show-warnings
